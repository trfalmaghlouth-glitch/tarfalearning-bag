<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحقيبة الإثرائية - أ. طرفه المغلوث</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ff;--card:#fff;--ink:#2b1f4d;--mute:#6b6288;--line:#e3d9fa;--pri:#9b7bea;--pri2:#6d48c9;--acc:#ffc65c;--soft:#ede5ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171128;--card:#221a3b;--ink:#f1ecff;--mute:#b3a8d4;--line:#38295f;--pri:#b79cff;--pri2:#7a56d6;--acc:#ffc65c;--soft:#2e2350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171128;--card:#221a3b;--ink:#f1ecff;--mute:#b3a8d4;--line:#38295f;--pri:#b79cff;--pri2:#7a56d6;--acc:#ffc65c;--soft:#2e2350;color-scheme:dark}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Segoe UI",sans-serif;line-height:1.8;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.28),transparent 40%),radial-gradient(circle at 85% 90%,rgba(255,198,92,.35),transparent 35%),linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:44px 20px 80px;position:relative;overflow:hidden;border-radius:0 0 40px 40px}
.hero svg{position:absolute;inset-inline-start:-40px;top:-30px;opacity:.12;width:320px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px;position:relative}
.hero h1{font-size:clamp(28px,6vw,48px);font-weight:700;line-height:1.3}
.hero p{opacity:.9;margin-top:6px}
.by{display:inline-block;margin-top:18px;background:#fff;color:#4a2ba8;padding:8px 22px;border-radius:99px;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(60,20,120,.3)}
.tools{display:flex;gap:10px;margin-top:-30px;position:relative;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font:inherit;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.theme{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.prog{margin:18px 0 4px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mute)}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-top:8px}
nav .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 18px;font-size:15px;transition:background .2s,color .2s}
nav button[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:24px 0 60px;min-height:60vh}
.intro{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:right;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--pri)}
.tile b{display:block;font-size:20px;margin:6px 0 2px}
.tile span{color:var(--mute);font-size:14px}
.ico{font-size:32px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sec-h h2{font-size:26px}
.sec-d{color:var(--mute);margin-bottom:18px}
.grp{margin:26px 0 12px;font-size:19px;font-weight:600;padding-inline-start:12px;border-inline-start:5px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:in .3s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.item h4{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.item h4 em{font-style:normal;background:var(--soft);border-radius:10px;padding:2px 8px;font-size:18px}
.acts{display:flex;gap:8px;margin-top:auto}
.go{flex:1;text-align:center;background:var(--pri);color:#fff;border-radius:10px;padding:8px;font-size:14px;font-weight:600}
.go.alt{background:var(--soft);color:var(--pri)}
.go:hover{filter:brightness(1.1)}
.chk{border:1px solid var(--line);background:none;border-radius:10px;padding:0 12px}
.chk[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#2a1d00}
.none{text-align:center;color:var(--mute);padding:40px}
.tile .ico{display:grid;place-items:center;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--soft),var(--line));font-size:30px}.tile{box-shadow:0 4px 14px rgba(109,72,201,.08)}.tile:hover{box-shadow:0 12px 28px rgba(109,72,201,.2)}.item{box-shadow:0 3px 10px rgba(109,72,201,.07)}.go{background:linear-gradient(135deg,var(--pri2),var(--pri))}.go.alt{background:var(--soft);color:var(--pri2)}nav button[aria-selected=true]{background:linear-gradient(135deg,var(--pri2),var(--pri))}.grp{border-inline-start-color:var(--pri)}.bar i{background:linear-gradient(90deg,var(--pri),var(--acc))}footer{text-align:center;color:var(--mute);font-size:14px;padding:20px 0 30px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2"><circle cx="50" cy="50" r="12"/><circle cx="50" cy="50" r="28"/><circle cx="50" cy="50" r="46"/><path d="M50 4v92M4 50h92"/></svg>
<div class="wrap">

</header>
<div class="wrap">

</div>
<div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>
</div>
<nav><div class="wrap" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>

var $=function(s){return document.querySelector(s)},cur="home",done={};
try{done=JSON.parse(localStorage.getItem("done")||"{}")}catch(e){}
function save(){try{localStorage.setItem("done",JSON.stringify(done))}catch(e){}}
var total=0;S.forEach(function(s){s.g.forEach(function(g){total+=g.l.length})});
function esc(x){return x.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
function prog(){var n=Object.keys(done).filter(function(k){return done[k]}).length;
$("#pt").textContent="أنجزت "+n+" من "+total;$("#pb").style.width=(n/total*100)+"%"}
function card(sid,gi,li,it){var k=sid+gi+li;
return '<div class="item"><h4><em>'+it[1]+'</em>'+it[0]+'</h4><div class="acts"><a class="go" target="_blank" rel="noopener" href="'+esc(it[2])+'" data-k="'+k+'">'+(it[3]?'فتح القصة':'فتح')+'</a>'+(it[3]?'<a class="go alt" target="_blank" rel="noopener" href="'+esc(it[4])+'">'+it[3]+'</a>':'')+'<button class="chk" data-k="'+k+'" aria-pressed="'+!!done[k]+'" aria-label="تم الإنجاز">✓</button></div></div>'}

function render(){var v=$("#view"),q=$("#q").value.trim(),h="";

else v.innerHTML=sec(S.filter(function(s){return s.id===cur})[0])}

function go(id){cur=id;$("#q").value="";tabs();render();window.scrollTo({top:$("nav").offsetTop-4})}
